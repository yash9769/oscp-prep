<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OSCP::PREP — Operator Log</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OSCP Prep">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0B0F14;
    --panel:#111820;
    --panel-2:#161F29;
    --panel-3:#1C2733;
    --border:#232F3B;
    --border-soft:#1A2530;
    --amber:#FFB020;
    --amber-dim:#8A6420;
    --amber-glow: rgba(255,176,32,0.18);
    --cyan:#5EC8D8;
    --green:#4FBF6B;
    --red:#E5484D;
    --text:#DCE4EC;
    --text-dim:#8896A6;
    --text-faint:#4F5D6E;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  a{color:var(--cyan);}
  button{font-family:var(--sans);cursor:pointer;}
  input,select,textarea{font-family:var(--sans);}
  .app{min-height:100vh;display:flex;flex-direction:column;}

  /* ===== HEADER ===== */
  .topbar{
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, #0D131A 0%, #0B0F14 100%);
    padding:14px 22px;
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:12px;
    position:sticky;top:0;z-index:50;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 2.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .brand-text{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:0.5px;}
  .brand-text .dim{color:var(--text-dim);font-weight:400;}
  .headstats{display:flex;gap:10px;flex-wrap:wrap;}
  .hstat{
    background:var(--panel);border:1px solid var(--border);border-radius:6px;
    padding:6px 12px;font-family:var(--mono);font-size:11px;color:var(--text-dim);
    display:flex;flex-direction:column;gap:2px;min-width:88px;
  }
  .hstat b{font-size:16px;color:var(--text);font-weight:600;}
  .hstat b.amber{color:var(--amber);}
  .hstat b.green{color:var(--green);}
  .hstat b.red{color:var(--red);}

  /* ===== TRACK SWITCH ===== */
  .track-switch{
    display:flex;background:var(--panel-3);border:1px solid var(--border);border-radius:8px;padding:3px;
    gap:2px;flex-shrink:0;
  }
  .track-opt{
    background:transparent;border:none;color:var(--text-dim);font-family:var(--mono);font-weight:700;
    font-size:11.5px;letter-spacing:.5px;padding:8px 16px;border-radius:6px;transition:all .15s;
  }
  .track-opt.active{background:var(--amber-glow);color:var(--amber);box-shadow:0 0 0 1px var(--amber-dim) inset;}
  @media(max-width:760px){
    .track-switch{order:3;width:100%;}
    .track-opt{flex:1;padding:11px 10px;font-size:12.5px;}
  }

  /* ===== CONCEPTS TAB ===== */
  .concept-row{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);
    border-radius:8px;background:var(--panel);margin-bottom:8px;flex-wrap:wrap;
  }
  .concept-name{flex:1;min-width:160px;font-size:13px;color:var(--text);}
  .concept-status{
    display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;
    padding:5px 10px;border-radius:6px;border:1px solid var(--border);color:var(--text-faint);white-space:nowrap;
  }
  .concept-status.done{border-color:var(--green);color:var(--green);background:rgba(79,191,107,0.1);}
  .concept-status.pending{border-color:var(--amber-dim);color:var(--amber);}
  .concept-badge{
    display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
    padding:4px 9px;border-radius:6px;border:1px solid var(--green);color:var(--green);
    background:rgba(79,191,107,0.1);margin-top:8px;
  }

  /* ===== KILL CHAIN RAIL ===== */
  .rail-wrap{border-bottom:1px solid var(--border);background:var(--panel);padding:14px 22px;overflow-x:auto;}
  .rail{display:flex;align-items:center;min-width:max-content;}
  .rail-seg{display:flex;align-items:center;flex-direction:column;gap:6px;position:relative;padding:0 18px;}
  .rail-node{
    width:34px;height:34px;border-radius:6px;border:1.5px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    font-size:10px;font-weight:700;background:var(--panel-2);color:var(--text-faint);
    transition:all .2s;
  }
  .rail-seg.done .rail-node{background:rgba(79,191,107,0.12);border-color:var(--green);color:var(--green);}
  .rail-seg.active .rail-node{background:var(--amber-glow);border-color:var(--amber);color:var(--amber);box-shadow:0 0 12px var(--amber-glow);}
  .rail-label{font-family:var(--mono);font-size:9.5px;letter-spacing:0.6px;color:var(--text-faint);text-transform:uppercase;white-space:nowrap;}
  .rail-seg.done .rail-label{color:var(--green);}
  .rail-seg.active .rail-label{color:var(--amber);}
  .rail-line{width:26px;height:1px;background:var(--border);}
  .rail-line.done{background:var(--green);}

  /* ===== LAYOUT ===== */
  .body{display:flex;flex:1;min-height:0;}
  .sidebar{
    width:198px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);
    padding:16px 10px;
  }
  .navitem{
    display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:6px;
    font-family:var(--mono);font-size:12.5px;color:var(--text-dim);cursor:pointer;
    margin-bottom:2px;border:1px solid transparent;transition:all .15s;
  }
  .navitem:hover{background:var(--panel-2);color:var(--text);}
  .navitem.active{background:var(--amber-glow);border-color:var(--amber-dim);color:var(--amber);}
  .navitem .n{opacity:.55;font-size:10px;}
  .main{flex:1;min-width:0;padding:24px;overflow-x:hidden;}

  /* ===== MOBILE ===== */
  @media(max-width:760px){
    .topbar{padding:12px 14px;gap:8px;position:static;}
    .brand-text{font-size:13px;}
    .brand-text .dim{display:block;font-size:10.5px;margin-top:1px;}
    .headstats{gap:6px;}
    .hstat{padding:5px 9px;min-width:72px;font-size:9.5px;}
    .hstat b{font-size:13px;}
    .rail-wrap{padding:10px 14px;}
    .rail-seg{padding:0 10px;}
    .rail-line{width:14px;}
    .body{flex-direction:column;}
    .sidebar{
      width:100%;display:flex;overflow-x:auto;gap:4px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
      border-right:none;border-top:1px solid var(--border);border-bottom:none;
      -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
      position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--panel);
      box-shadow:0 -2px 10px rgba(0,0,0,.25);
    }
    .navitem{
      flex-shrink:0;margin-bottom:0;white-space:nowrap;scroll-snap-align:start;
      min-height:44px;min-width:44px;display:flex;align-items:center;
    }
    .main{padding:14px;padding-bottom:calc(66px + env(safe-area-inset-bottom));}
    .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
    .readiness-ring{flex-direction:column;align-items:flex-start;text-align:left;}
    .day-controls{gap:6px;}
    .day-controls label{margin-left:0;width:100%;justify-content:flex-start;margin-top:4px;}
    .dayhead{padding:11px 12px;}
    .daymeta{gap:6px;}
    .daybody{padding:0 12px 14px 12px;}
  }
  @media(max-width:400px){
    .headstats{width:100%;justify-content:space-between;}
    .hstat{min-width:0;flex:1 1 30%;}
  }
  .section-title{font-family:var(--mono);font-size:13px;color:var(--amber);letter-spacing:1px;text-transform:uppercase;margin:0 0 4px 0;}
  .section-sub{color:var(--text-dim);font-size:13px;margin:0 0 18px 0;}

  /* ===== CARDS / GRID ===== */
  .grid{display:grid;gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:1fr 1fr;}
  @media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}
  @media(max-width:640px){.grid-4{grid-template-columns:1fr;}}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;}
  .card-label{font-family:var(--mono);font-size:10px;color:var(--text-faint);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
  .card-value{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--text);}
  .card-value.amber{color:var(--amber);}
  .card-value.green{color:var(--green);}
  .card-value.red{color:var(--red);}
  .card-sub{font-size:11.5px;color:var(--text-dim);margin-top:4px;}

  .readiness-ring{display:flex;align-items:center;gap:20px;}
  .ring{position:relative;width:112px;height:112px;flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-text b{font-family:var(--mono);font-size:26px;color:var(--amber);}
  .ring-text span{font-family:var(--mono);font-size:9px;color:var(--text-faint);letter-spacing:1px;}

  .barlist{display:flex;flex-direction:column;gap:10px;}
  .barrow{display:flex;align-items:center;gap:10px;}
  .barrow .lbl{width:130px;font-size:11.5px;color:var(--text-dim);font-family:var(--mono);flex-shrink:0;}
  .bartrack{flex:1;height:7px;background:var(--panel-3);border-radius:4px;overflow:hidden;}
  .barfill{height:100%;background:linear-gradient(90deg,var(--amber-dim),var(--amber));border-radius:4px;}
  .barval{width:32px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--text-dim);}

  .tag{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:4px;letter-spacing:.5px;}
  .tag.weak{background:rgba(229,72,77,0.12);color:var(--red);border:1px solid rgba(229,72,77,.3);}
  .tag.strong{background:rgba(79,191,107,0.12);color:var(--green);border:1px solid rgba(79,191,107,.3);}

  /* ===== DAY CARDS ===== */
  .daylist{display:flex;flex-direction:column;gap:10px;}
  .daycard{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .daycard.today{border-color:var(--amber-dim);box-shadow:0 0 0 1px var(--amber-dim) inset;}
  .daycard.complete{opacity:.62;}
  .dayhead{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px;flex-wrap:wrap;}
  .dayhead-left{display:flex;align-items:center;gap:12px;}
  .daynum{font-family:var(--mono);font-size:11px;color:var(--text-faint);width:44px;flex-shrink:0;}
  .dayinfo b{display:block;font-size:13.5px;color:var(--text);}
  .dayinfo span{font-size:11.5px;color:var(--text-dim);}
  .daymeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pill{font-family:var(--mono);font-size:9.5px;padding:3px 8px;border-radius:10px;border:1px solid var(--border);color:var(--text-dim);white-space:nowrap;}
  .pill.phase{background:var(--panel-3);}
  .progress-mini{width:60px;height:5px;background:var(--panel-3);border-radius:3px;overflow:hidden;}
  .progress-mini i{display:block;height:100%;background:var(--amber);}
  .daybody{padding:0 16px 16px 16px;display:none;border-top:1px solid var(--border-soft);}
  .daybody.open{display:block;}
  .day-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px;}
  @media(max-width:800px){.day-cols{grid-template-columns:1fr;}}
  .day-field{margin-bottom:10px;}
  .day-field .fl{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);letter-spacing:.6px;text-transform:uppercase;margin-bottom:3px;}
  .day-field .fv{font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .checklist{display:flex;flex-direction:column;gap:7px;margin-top:6px;}
  .chk{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text);}
  .chk input{margin-top:2px;accent-color:var(--amber);cursor:pointer;}
  .chk.done label{color:var(--text-faint);text-decoration:line-through;}
  .day-controls{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;}
  .num-input{width:56px;background:var(--panel-3);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 6px;font-family:var(--mono);font-size:11.5px;}
  .sel{background:var(--panel-3);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 8px;font-family:var(--mono);font-size:11px;}
  .txt-notes{width:100%;background:var(--panel-3);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:7px 9px;font-size:12px;font-family:var(--sans);resize:vertical;min-height:44px;}
  .small-lbl{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);margin-right:4px;}

  /* ===== TABLE ===== */
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
  table{width:100%;border-collapse:collapse;font-size:12px;min-width:760px;}
  thead th{
    background:var(--panel-2);color:var(--text-faint);font-family:var(--mono);font-size:10px;
    letter-spacing:.6px;text-transform:uppercase;text-align:left;padding:10px 12px;
    border-bottom:1px solid var(--border);position:sticky;top:0;
  }
  tbody td{padding:9px 12px;border-bottom:1px solid var(--border-soft);color:var(--text-dim);vertical-align:top;}
  tbody tr:hover{background:var(--panel-2);}
  tbody input[type=text],tbody input[type=number],tbody input[type=date],tbody select{
    background:transparent;border:1px solid transparent;color:var(--text);width:100%;font-family:var(--sans);font-size:12px;padding:3px 4px;border-radius:4px;
  }
  tbody input:hover,tbody select:hover,tbody input:focus,tbody select:focus{background:var(--panel-3);border-color:var(--border);outline:none;}
  .conf-badge{font-family:var(--mono);font-weight:600;}
  .btn{background:var(--panel-3);border:1px solid var(--border);color:var(--text-dim);padding:6px 12px;border-radius:6px;font-family:var(--mono);font-size:11px;transition:all .15s;}
  .btn:hover{border-color:var(--amber-dim);color:var(--amber);}
  .btn.primary{background:var(--amber-glow);border-color:var(--amber-dim);color:var(--amber);}
  .btn.danger:hover{border-color:var(--red);color:var(--red);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}

  .empty-note{padding:30px;text-align:center;color:var(--text-faint);font-family:var(--mono);font-size:12px;border:1px dashed var(--border);border-radius:8px;}
  .save-indicator{position:fixed;bottom:16px;right:20px;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);background:var(--panel);border:1px solid var(--border);padding:6px 12px;border-radius:20px;opacity:0;transition:opacity .3s;z-index:100;}
  .save-indicator.show{opacity:1;}
  .save-indicator.saved{color:var(--green);}

  .banner{background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:6px;padding:12px 16px;font-size:12.5px;color:var(--text-dim);margin-bottom:18px;line-height:1.6;}
  .banner b{color:var(--text);}
  .io-btns{display:flex;gap:8px;}
  .io-btns .btn{font-size:10.5px;padding:6px 10px;}
  #importFileInput{display:none;}
  .toast{position:fixed;bottom:16px;left:20px;font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--border);padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .3s;z-index:100;color:var(--text);}
  .toast.show{opacity:1;}
  .toast.err{border-color:var(--red);color:var(--red);}
  .toast.ok{border-color:var(--green);color:var(--green);}
  @media(max-width:760px){
    .io-btns{flex-wrap:wrap;}
    .save-indicator{bottom:calc(66px + env(safe-area-inset-bottom));right:12px;}
    .toast{bottom:calc(66px + env(safe-area-inset-bottom));left:12px;}
  }

  /* ===== LIGHT THEME ===== */
  html.light-theme{
    --bg:#F5F3EE; --panel:#FFFFFF; --panel-2:#F0EDE5; --panel-3:#E7E2D4;
    --border:#DCD5C4; --border-soft:#E8E2D2;
    --amber:#B8681E; --amber-dim:#E3B583; --amber-glow: rgba(184,104,30,0.14);
    --cyan:#0C7480; --green:#237A48; --red:#B23838;
    --text:#232A22; --text-dim:#5F6A5C; --text-faint:#98A092;
  }
  html.light-theme .ring-text b{color:var(--amber);}
  html.light-theme ::-webkit-scrollbar-thumb{background:#CFC8B4;}

  /* ===== TODAY FOCUS BANNER ===== */
  .focus-card{
    background:linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--amber-dim);border-radius:10px;padding:18px 20px;margin-bottom:16px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .focus-eyebrow{font-family:var(--mono);font-size:9.5px;color:var(--amber);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px;}
  .focus-title{font-size:17px;font-weight:600;color:var(--text);margin-bottom:4px;}
  .focus-sub{font-size:12.5px;color:var(--text-dim);}

  /* ===== XP / LEVEL ===== */
  .xp-row{display:flex;align-items:center;gap:14px;}
  .xp-badge{
    width:52px;height:52px;border-radius:10px;background:var(--amber-glow);border:1.5px solid var(--amber-dim);
    display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;
  }
  .xp-badge b{font-family:var(--mono);font-size:18px;color:var(--amber);line-height:1;}
  .xp-badge span{font-family:var(--mono);font-size:7.5px;color:var(--text-faint);letter-spacing:.5px;}
  .xp-bar-track{flex:1;height:8px;background:var(--panel-3);border-radius:5px;overflow:hidden;}
  .xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--amber-dim),var(--amber));border-radius:5px;transition:width .3s;}

  /* ===== HEATMAP ===== */
  .heatmap{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:6px;}
  .heat-cell{aspect-ratio:1;border-radius:3px;background:var(--panel-3);}
  .heat-cell[data-lvl="1"]{background:var(--amber-dim);opacity:.5;}
  .heat-cell[data-lvl="2"]{background:var(--amber-dim);}
  .heat-cell[data-lvl="3"]{background:var(--amber);}
  .heatmap-legend{display:flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--mono);font-size:9.5px;color:var(--text-faint);}
  .heatmap-legend .heat-cell{width:10px;height:10px;flex:none;}

  /* ===== SEARCH ===== */
  .search-input{background:var(--panel-3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 12px;font-family:var(--mono);font-size:11.5px;width:220px;}
  .search-input::placeholder{color:var(--text-faint);}

  /* ===== TIMER ===== */
  .timer-btn{font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:5px;border:1px solid var(--border);background:var(--panel-3);color:var(--text-dim);}
  .timer-btn.running{background:rgba(229,72,77,0.12);border-color:var(--red);color:var(--red);animation:pulse 1.6s infinite;}
  .timer-display{font-family:var(--mono);font-size:11px;color:var(--amber);min-width:52px;display:inline-block;}

  /* ===== ICON BUTTONS ===== */
  .icon-btn{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .icon-btn:hover{border-color:var(--amber-dim);color:var(--amber);}

  /* ===== KEYBOARD HINT ===== */
  .kbd-hint{font-family:var(--mono);font-size:10px;color:var(--text-faint);margin-top:10px;}
  .kbd-hint kbd{background:var(--panel-3);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-family:var(--mono);}

  /* ===== PRINT ===== */
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;padding:20px;color:#000;}
    #printArea .fl{font-weight:700;margin-top:10px;}
    #printArea .fv{margin-bottom:6px;}
  }

  /* ===== PIN MODAL ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(6,8,11,0.86);z-index:200;
    display:flex;align-items:center;justify-content:center;padding:20px;
    backdrop-filter:blur(3px);
  }
  .modal-card{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:28px 26px;max-width:400px;width:100%;
  }
  .modal-eyebrow{font-family:var(--mono);font-size:10px;color:var(--amber);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px;}
  .modal-title{font-size:17px;font-weight:600;color:var(--text);margin-bottom:10px;}
  .modal-body{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin-bottom:16px;}
  .modal-body b{color:var(--text);}
  .modal-input{
    width:100%;background:var(--panel-3);border:1px solid var(--border);color:var(--text);
    border-radius:7px;padding:11px 13px;font-family:var(--mono);font-size:14px;margin-bottom:12px;
    letter-spacing:1px;
  }
  .modal-input:focus{outline:none;border-color:var(--amber-dim);}
  .modal-actions{display:flex;gap:8px;}
  .modal-actions .btn{flex:1;justify-content:center;text-align:center;padding:10px;font-size:12px;}
  .modal-error{color:var(--red);font-family:var(--mono);font-size:11px;margin-bottom:10px;min-height:14px;}

  /* ===== ONLINE/OFFLINE ===== */
  .conn-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}
  .conn-dot.online{background:var(--green);}
  .conn-dot.offline{background:var(--red);}
</style>

/* =========================================================
   STORAGE — PIN-synced (Cloudflare KV) + local cache fallback
   ========================================================= */
let state = null;
let saveTimer = null;
let PIN = localStorage.getItem("oscp_pin") || "";
const API_BASE = "/api/data";

function cacheKey(){ return "oscp_cache_" + PIN; }

function ensurePin(){
  return new Promise((resolve)=>{
    if(PIN){ resolve(); return; }
    showPinModal(resolve);
  });
}

function showPinModal(onDone){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <div class="modal-eyebrow">Sync Setup</div>
      <div class="modal-title">Set your sync PIN</div>
      <div class="modal-body">This PIN links your data across every device — phone, laptop, anywhere.
        <b>First time?</b> Make one up (6+ characters, letters/numbers). <b>Already have one</b> from another device? Enter it here to pull your existing data. Write it down — it's the only way back in.</div>
      <input type="text" class="modal-input" id="pinModalInput" placeholder="e.g. yash-oscp-2026" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="modal-error" id="pinModalError"></div>
      <div class="modal-actions">
        <button class="btn primary" id="pinModalGo">Continue →</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#pinModalInput');
  const err = overlay.querySelector('#pinModalError');
  input.focus();
  const submit = ()=>{
    const val = input.value.trim();
    if(!/^[a-zA-Z0-9\-_]{6,64}$/.test(val)){
      err.textContent = 'Use 6+ characters — letters, numbers, - or _ only.';
      return;
    }
    PIN = val;
    localStorage.setItem("oscp_pin", PIN);
    document.body.removeChild(overlay);
    onDone();
  };
  overlay.querySelector('#pinModalGo').onclick = submit;
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
}

async function loadState(){
  await ensurePin();
  let loadedFromCloud = false;
  try{
    const res = await fetch(`${API_BASE}?pin=${encodeURIComponent(PIN)}`, {cache:'no-store'});
    const json = await res.json();
    if(json && json.exists === false){
      const cached = localStorage.getItem(cacheKey());
      state = cached ? JSON.parse(cached) : defaultState();
    } else if(json && !json.error){
      state = json;
      loadedFromCloud = true;
    } else {
      const cached = localStorage.getItem(cacheKey());
      state = cached ? JSON.parse(cached) : defaultState();
    }
  }catch(e){
    const cached = localStorage.getItem(cacheKey());
    state = cached ? JSON.parse(cached) : defaultState();
  }
  migrateState();
  localStorage.setItem(cacheKey(), JSON.stringify(state));
  if(!loadedFromCloud) queueSave();
}

function installDaysAccessor(obj){
  Object.defineProperty(obj, 'days', {
    configurable:true, enumerable:false,
    get(){ return this.meta.track==='ejpt' ? this.ejptDays : this.oscpDays; },
    set(v){ if(this.meta.track==='ejpt') this.ejptDays = v; else this.oscpDays = v; }
  });
}

function migrateState(){
  if(!state.settings) state.settings = {theme:"dark", sound:true};
  if(state.settings.sound===undefined) state.settings.sound = true;
  if(!state.settings.theme) state.settings.theme = "dark";
  if(!state.meta.track) state.meta.track = "oscp";
  // Back-compat: older saves only had a flat `days` array (OSCP-only).
  if(!state.oscpDays){
    state.oscpDays = Array.isArray(state.days) ? state.days : buildPhase1Days();
  }
  if(!state.ejptDays) state.ejptDays = buildEjptDays();
  delete state.days;
  installDaysAccessor(state);
  [...state.oscpDays, ...state.ejptDays].forEach(d=>{
    if(d.completedDate===undefined) d.completedDate = "";
    if(d.timerStart===undefined) d.timerStart = "";
    if(d.concepts===undefined) d.concepts = [];
    if(d.track===undefined) d.track = state.oscpDays.includes(d) ? "oscp" : "ejpt";
  });
}

function queueSave(){
  const ind = document.getElementById('saveIndicator');
  if(ind){
    ind.textContent = 'saving…';
    ind.classList.remove('saved');
    ind.classList.add('show');
  }
  localStorage.setItem(cacheKey(), JSON.stringify(state));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      const res = await fetch(API_BASE, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({pin:PIN, data:state})
      });
      const json = await res.json();
      if(!ind) return;
      if(json && json.ok){
        ind.textContent = 'synced ✓';
        ind.classList.add('saved');
      } else {
        ind.textContent = 'saved locally — sync pending';
      }
      setTimeout(()=>ind.classList.remove('show'), 1400);
    }catch(e){
      if(ind) ind.textContent = 'offline — saved locally';
    }
  }, 500);
}

/* =========================================================
   COMPUTED METRICS
   ========================================================= */
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

function computeMetrics(){
  const today = new Date().toISOString().slice(0,10);
  const days = state.days;
  const totalDays = days.length;
  const completedDays = days.filter(d=>d.completed).length;
  const totalTasks = days.reduce((s,d)=>s+d.tasks.length,0);
  const doneTasks = days.reduce((s,d)=>s+d.tasks.filter(t=>t.done).length,0);
  const totalHoursPlanned = days.reduce((s,d)=>s+(parseFloat(d.estHours)||0),0);
  const totalHoursActual = days.reduce((s,d)=>s+(parseFloat(d.actHours)||0),0);

  // streak: consecutive completed days from the start
  let streak = 0;
  for(const d of days){ if(d.completed) streak++; else break; }

  const daysRemaining = daysBetween(today, state.meta.examDate);

  // readiness score — weighted blend of skill confidence (60%), independent lab completion (25%), mock exam perf (15%)
  const skillAvg = state.skills.length ? state.skills.reduce((s,k)=>s+ (parseFloat(k.confidence)||0),0)/state.skills.length : 0; // 0-5
  const skillScore = (skillAvg/5)*100;

  const labs = state.labs;
  let labScore = 0;
  if(labs.length){
    const independentPts = labs.reduce((s,l)=>{
      const help = parseInt(l.hintsUsed)||0;
      if(help===0) return s+100;
      if(help===1) return s+70;
      if(help===2) return s+40;
      return s+10;
    },0);
    labScore = independentPts/labs.length;
  }

  const mocks = state.mocks.filter(m=>m.status==="Completed");
  let mockScore = 0;
  if(mocks.length){
    mockScore = mocks.reduce((s,m)=>{
      const attempted = parseFloat(m.attempted)||0;
      const rooted = parseFloat(m.rooted)||0;
      return s + (attempted>0 ? (rooted/attempted)*100 : 0);
    },0)/mocks.length;
  }

  const readiness = Math.round(skillScore*0.6 + labScore*0.25 + mockScore*0.15);

  const weak = state.skills.filter(k=>parseFloat(k.confidence)<=2).sort((a,b)=>a.confidence-b.confidence).slice(0,5);
  const strong = state.skills.filter(k=>parseFloat(k.confidence)>=4).sort((a,b)=>b.confidence-a.confidence).slice(0,5);

  // current phase = phase of first non-completed day, else last phase
  const firstOpen = days.find(d=>!d.completed);
  const currentPhase = firstOpen ? firstOpen.phase : (days.length? days[days.length-1].phase : activePhases()[0]);
  const currentDayNum = firstOpen ? firstOpen.day : (days.length? days[days.length-1].day+1 : 1);

  const weekNum = Math.ceil(currentDayNum/7);
  const weekDays = days.filter(d=>Math.ceil(d.day/7)===weekNum);
  const weeklyCompletion = weekDays.length ? Math.round(weekDays.filter(d=>d.completed).length/weekDays.length*100) : 0;

  // XP / level
  const xp = doneTasks*5 + completedDays*20 + labs.filter(l=>l.rooted).length*50 +
             state.skills.filter(k=>parseFloat(k.confidence)>=4).length*10 + mocks.length*40;
  const levelThresholds = [0,100,250,450,700,1000,1400,1900,2500,3200,4000];
  let level = 0;
  while(level < levelThresholds.length-1 && xp >= levelThresholds[level+1]) level++;
  const curFloor = levelThresholds[level];
  const nextCeil = levelThresholds[level+1] || (curFloor + 1000);
  const xpIntoLevel = xp - curFloor;
  const xpForLevel = nextCeil - curFloor;
  const xpPct = Math.min(100, Math.round(xpIntoLevel/xpForLevel*100));

  return {
    totalDays, completedDays, totalTasks, doneTasks,
    totalHoursPlanned, totalHoursActual, streak, daysRemaining,
    readiness, weak, strong, currentPhase, currentDayNum, weeklyCompletion,
    overallPct: totalTasks? Math.round(doneTasks/totalTasks*100) : 0,
    xp, level, xpIntoLevel, xpForLevel, xpPct
  };
}

function renderRail(m){

      return `<div class="rail-seg ${cls}">
        <div class="rail-node">${icon}</div>
        <div class="rail-label">${phaseShort[i]}</div>
      </div>${i<phases.length-1?`<div class="rail-line ${i<currentIdx?'done':''}"></div>`:''}`;

function renderTab(tab, m){

function renderHeatmap(){
  const days = 14;
  const cells = [];
  const today = new Date();
  for(let i=days-1;i>=0;i--){
    const d = new Date(today);
    d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const hits = state.days.filter(dd=>dd.completedDate===key).length;
    const lvl = hits===0?0:(hits===1?2:3);
    cells.push(`<div class="heat-cell" data-lvl="${lvl}" title="${key}: ${hits} day(s) completed"></div>`);
  }
  return `<div class="heatmap">${cells.join('')}</div>`;
}

function otherTrackCoverage(d){
  if(!d.concepts || !d.concepts.length) return null;
  const otherKey = d.track==='ejpt' ? 'oscp' : 'ejpt';
  const otherDays = otherKey==='ejpt' ? state.ejptDays : state.oscpDays;
  const hits = [];
  d.concepts.forEach(c=>{
    const match = (otherDays||[]).find(od=>od.completed && (od.concepts||[]).includes(c));
    if(match) hits.push({concept:c, day:match});
  });
  if(!hits.length) return null;
  return {otherKey, hits};
}

/* =========================================================
   CONCEPTS — shared progress across OSCP and eJPT
   ========================================================= */
function buildConceptStatus(){
  const rows = [];
  Object.keys(CONCEPTS_META).forEach(slug=>{
    const oscpDays = state.oscpDays.filter(d=>(d.concepts||[]).includes(slug));
    const ejptDays = state.ejptDays.filter(d=>(d.concepts||[]).includes(slug));
    if(!oscpDays.length && !ejptDays.length) return;
    rows.push({
      slug, label: CONCEPTS_META[slug],
      oscp:{ inTrack: !!oscpDays.length, done: oscpDays.some(d=>d.completed), days: oscpDays },
      ejpt:{ inTrack: !!ejptDays.length, done: ejptDays.some(d=>d.completed), days: ejptDays }
    });
  });
  return rows;
}

function renderConcepts(){
  const rows = buildConceptStatus();
  const mastered = rows.filter(r=>r.oscp.done || r.ejpt.done).length;
  const shared = rows.filter(r=>r.oscp.inTrack && r.ejpt.inTrack).length;
  return `
  <div class="section-title">Concepts — cross-track progress</div>
  <div class="section-sub">Concepts tagged on both OSCP and eJPT days. Complete either track's day and it's marked done here — and flagged as already-covered on the other track's matching day.</div>
  <div class="grid grid-3" style="margin-bottom:16px;">
    <div class="card"><div class="card-label">Tracked Concepts</div><div class="card-value">${rows.length}</div></div>
    <div class="card"><div class="card-label">Mastered (either track)</div><div class="card-value green">${mastered}</div></div>
    <div class="card"><div class="card-label">Shared by both tracks</div><div class="card-value amber">${shared}</div></div>
  </div>
  ${rows.map(r=>`
    <div class="concept-row">
      <div class="concept-name"><b>${r.label}</b></div>
      <div class="concept-status ${!r.oscp.inTrack ? '' : (r.oscp.done ? 'done' : 'pending')}">
        ${!r.oscp.inTrack ? 'OSCP — n/a' : (r.oscp.done ? '✓ OSCP done' : '○ OSCP pending')}
      </div>
      <div class="concept-status ${!r.ejpt.inTrack ? '' : (r.ejpt.done ? 'done' : 'pending')}">
        ${!r.ejpt.inTrack ? 'eJPT — n/a' : (r.ejpt.done ? '✓ eJPT done' : '○ eJPT pending')}
      </div>
    </div>
  `).join('')}
  ${!rows.length ? `<div class="empty-note">No tagged concepts yet.</div>` : ''}
  `;
}

}

      Topic:w.topic, Problem:w.problem, "First Seen":w.firstSeen, Severity:w.severity,
      "Revision Needed":w.revisionNeeded, "Revision Date":w.revisionDate, Revised:w.revised,
      Result:w.result, Confidence:w.confidence
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(weak.length?weak:[{Topic:""}]), "Weak Points");

    const weekly = state.weeklyReviews.map(w=>({

      "Machines Done":w.machinesDone, "Weak Areas":w.weakAreas, "Strong Areas":w.strongAreas,

function importFromExcel(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sheet = (name)=> wb.SheetNames.includes(name) ? XLSX.utils.sheet_to_json(wb.Sheets[name]) : null;

      const daily = sheet("Daily Plan");
      if(daily){
        state.days = daily.map(r=>{
          let tasks = [];
          try{ tasks = JSON.parse(r["Checklist (JSON)"]||"[]"); }catch(_){ tasks = []; }
          return {
            id:r.Day, day:r.Day, phase:r.Phase||"", objective:r.Objective||"", topic:r.Topic||"",
            subtopics:r.Subtopics||"", theory:r["Theory Task"]||"", practical:r["Practical Task"]||"",
            lab:r["Lab/Machine"]||"", tools:r["Tools/Commands"]||"", tasks:tasks,
            estHours:r["Est Hours"]||"", actHours:r["Actual Hours"]||"", priority:r.Priority||"Medium",
            difficulty:r.Difficulty||"Medium", confidence:r.Confidence||0, status:r.Status||"Not started",
            completed: r.Completed===true || r.Completed==="TRUE" || r.Completed===1, notes:r.Notes||"",
            completedDate:"", timerStart:""
          };
        });
      }

      const skills = sheet("Skill Matrix");
      if(skills){
        state.skills = skills.map((r,i)=>({
          id:i+1, name:r.Skill||"", level:r.Level||"Beginner", confidence:r.Confidence||0,
          target:r.Target||4, practiceCount:r["Practice Count"]||0, lastPracticed:r["Last Practiced"]||"",
          status:r.Status||"Not started"
        }));
      }

      const labs = sheet("Lab Tracker");
      if(labs){
        state.labs = labs.filter(r=>r.Machine).map((r,i)=>({
          id:i+1, platform:r.Platform||"", machine:r.Machine||"", difficulty:r.Difficulty||"Easy",
          os:r.OS||"Linux", started:r.Started||"", completed:r.Completed||"", timeSpent:r["Time Spent (h)"]||"",
          foothold:r.Foothold||"", privesc:r.Privesc||"", hintsUsed:r["Hints Used (0-3)"]||0,
          rooted: r["Rooted/SYSTEM"]===true||r["Rooted/SYSTEM"]==="TRUE", reportDone: r["Report Done"]===true||r["Report Done"]==="TRUE",
          keyLesson:r["Key Lesson"]||""
        }));
      }

      const cmds = sheet("Commands");
      if(cmds){
        state.commands = cmds.filter(r=>r.Command).map((r,i)=>({
          id:i+1, category:r.Category||"", command:r.Command||"", purpose:r.Purpose||"",
          whenToUse:r["When To Use"]||"", example:r.Example||"", relevance:r["OSCP Relevance"]||"",
          practiced: r.Practiced===true||r.Practiced==="TRUE"
        }));
      }

      const weak = sheet("Weak Points");
      if(weak){
        state.weaknesses = weak.filter(r=>r.Topic).map((r,i)=>({
          id:i+1, topic:r.Topic||"", problem:r.Problem||"", firstSeen:r["First Seen"]||"",
          severity:r.Severity||"Medium", revisionNeeded:r["Revision Needed"]===true||r["Revision Needed"]==="TRUE",
          revisionDate:r["Revision Date"]||"", revised:r.Revised===true||r.Revised==="TRUE",
          result:r.Result||"", confidence:r.Confidence||0
        }));
      }

      const weekly = sheet("Weekly Review");
      if(weekly){
        state.weeklyReviews = weekly.filter(r=>r.Week).map((r,i)=>({
          id:i+1, week:r.Week||"", plannedHrs:r["Planned Hrs"]||"", actualHrs:r["Actual Hrs"]||"",
          completionPct:r["Completion %"]||"", machinesDone:r["Machines Done"]||"", weakAreas:r["Weak Areas"]||"",
          strongAreas:r["Strong Areas"]||"", reviseNext:r["Revise Next"]||"", stopWasting:r["Stop Wasting Time On"]||"",
          nextPriority:r["Next Priority"]||""
        }));
      }

      const mocks = sheet("Mock Exams");
      if(mocks){
        state.mocks = mocks.map((r,i)=>({
          id:i+1, phase:r.Phase||"", plannedWhen:r["Planned When"]||"", status:r.Status||"Upcoming",
          date:r.Date||"", duration:r["Duration (h)"]||"", attempted:r.Attempted||"", rooted:r.Rooted||"",
          score:r.Score||"", notes:r.Notes||""
        }));
      }

      const dash = sheet("Dashboard");
      if(dash && dash[0] && dash[0]["Target Exam Date"]) state.meta.examDate = dash[0]["Target Exam Date"];

      queueSave();
      render();
      showToast('Imported successfully', 'ok');
    }catch(err){
      console.error(err);
      showToast('Import failed — check file format', 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}

   THEME / SOUND / UNDO / TIMER / PDF
   ========================================================= */
function applyTheme(){
  document.documentElement.classList.toggle('light-theme', state.settings.theme==='light');
}
function toggleTheme(){
  state.settings.theme = state.settings.theme==='light' ? 'dark' : 'light';
  applyTheme();
  queueSave();
  render();
}
function toggleSound(){
  state.settings.sound = !state.settings.sound;
  queueSave();
  render();
}
function playFeedback(){
  if(!state.settings.sound) return;
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 720;
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.18);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.18);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(25);
}

let undoStack = [];
function pushUndo(){
  try{
    undoStack.push(JSON.stringify(state));
    if(undoStack.length>5) undoStack.shift();
  }catch(e){}
}
function undo(){
  if(undoStack.length===0){ showToast('Nothing to undo this session', 'err'); return; }
  state = JSON.parse(undoStack.pop());
  migrateState();
  applyTheme();
  queueSave();
  render();
  showToast('Undone', 'ok');
}

let tickInterval = null;
function startGlobalTick(){
  if(tickInterval) return;
  tickInterval = setInterval(()=>{
    document.querySelectorAll('[data-timer-display]').forEach(el=>{
      const dayId = parseInt(el.getAttribute('data-timer-display'));
      const d = findById(state.days, dayId);
      if(d && d.timerStart){
        const elapsed = Date.now() - new Date(d.timerStart).getTime();
        const mins = Math.floor(elapsed/60000);
        const secs = Math.floor((elapsed%60000)/1000);
        el.textContent = String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
      }
    });
  }, 1000);
}

function setupKeyboardShortcuts(){
  document.addEventListener('keydown', (e)=>{
    if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
    if(activeTab !== 'daily' || !openDayId) return;
    const day = findById(state.days, openDayId);
    if(!day) return;
    if(e.code === 'Space'){
      e.preventDefault();
      const nextTask = day.tasks.find(t=>!t.done);
      if(nextTask){ nextTask.done = true; playFeedback(); queueSave(); render(); }
    } else if(e.code === 'ArrowRight'){
      const idx = state.days.findIndex(d=>d.id===openDayId);
      if(idx < state.days.length-1){ openDayId = state.days[idx+1].id; render(); }
    } else if(e.code === 'ArrowLeft'){
      const idx = state.days.findIndex(d=>d.id===openDayId);
      if(idx > 0){ openDayId = state.days[idx-1].id; render(); }
    }
  });
}

/* =========================================================
   EVENT HANDLERS
   ========================================================= */
function findById(arr,id){ return arr.find(x=>String(x.id)===String(id)); }

function attachHandlers(){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{ activeTab = el.getAttribute('data-tab'); render(); };
  });

  document.querySelectorAll('[data-track]').forEach(el=>{
    el.onclick = ()=>{
      const t = el.getAttribute('data-track');
      if(state.meta.track === t) return;
      state.meta.track = t;
      openDayId = null;
      queueSave();
      render();
    };
  });

  document.querySelectorAll('[data-day-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute('data-day-toggle');
      openDayId = (openDayId === parseInt(id)) ? null : parseInt(id);
      render();
    };
  });

  document.querySelectorAll('[data-task-day]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); };
    el.onchange = (e)=>{
      e.stopPropagation();
      pushUndo();
      const dayId = parseInt(el.getAttribute('data-task-day'));
      const taskId = el.getAttribute('data-task-id');
      const day = findById(state.days, dayId);
      const task = day.tasks.find(t=>t.id===taskId);
      task.done = el.checked;
      if(el.checked) playFeedback();
      queueSave();
      render();
    };
  });

  document.querySelectorAll('[data-day-field]').forEach(el=>{
    const evt = el.tagName==='TEXTAREA' ? 'input' : 'change';
    el[evt==='input'?'oninput':'onchange'] = ()=>{
      const [dayId, field] = el.getAttribute('data-day-field').split(':');
      const day = findById(state.days, parseInt(dayId));
      day[field] = el.value;
      queueSave();
    };
  });

  document.querySelectorAll('[data-day-complete]').forEach(el=>{
    el.onchange = ()=>{
      pushUndo();
      const dayId = parseInt(el.getAttribute('data-day-complete'));
      const day = findById(state.days, dayId);
      day.completed = el.checked;
      if(el.checked){
        day.status = "Done";
        day.completedDate = new Date().toISOString().slice(0,10);
        playFeedback();
      } else {
        day.completedDate = "";
      }
      queueSave();
      render();
    };
  });

  document.querySelectorAll('[data-timer-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const dayId = parseInt(el.getAttribute('data-timer-toggle'));
      const day = findById(state.days, dayId);
      if(day.timerStart){
        const elapsedMs = Date.now() - new Date(day.timerStart).getTime();
        const elapsedHrs = elapsedMs/3600000;
        const prevActual = parseFloat(day.actHours)||0;
        day.actHours = Math.round((prevActual+elapsedHrs)*100)/100;
        day.timerStart = "";
      } else {
        day.timerStart = new Date().toISOString();
      }
      queueSave();
      render();
    };
  });

  document.querySelectorAll('[data-pdf-day]').forEach(el=>{
    el.onclick = ()=> exportDayPDF(parseInt(el.getAttribute('data-pdf-day')));
  });

  const jumpTodayBtn = document.getElementById('jumpTodayBtn');
  if(jumpTodayBtn){
    jumpTodayBtn.onclick = ()=>{
      const d = state.days.find(x=>!x.completed);
      if(d){
        activeTab='daily'; openDayId=d.id; render();
        setTimeout(()=>{
          const el = document.querySelector(`[data-day-toggle="${d.id}"]`);
          if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
        }, 60);
      }
    };
  }

  const examInput = document.getElementById('examDateInput');
  if(examInput){ examInput.onchange = ()=>{ state.meta.examDate = examInput.value; queueSave(); render(); }; }

  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.onclick = exportToExcel;
  const importBtn = document.getElementById('importBtn');
  const importFileInput = document.getElementById('importFileInput');
  if(importBtn) importBtn.onclick = ()=> importFileInput.click();
  if(importFileInput) importFileInput.onchange = (e)=>{
    if(e.target.files && e.target.files[0]){ pushUndo(); importFromExcel(e.target.files[0]); }
    importFileInput.value = "";
  };

  const themeBtn = document.getElementById('themeBtn');
  if(themeBtn) themeBtn.onclick = toggleTheme;
  const soundBtn = document.getElementById('soundBtn');
  if(soundBtn) soundBtn.onclick = toggleSound;
  const undoBtn = document.getElementById('undoBtn');
  if(undoBtn) undoBtn.onclick = undo;
  const pinBtn = document.getElementById('pinBtn');
  if(pinBtn) pinBtn.onclick = showPinInfoModal;

  const labSearch = document.getElementById('labSearch');
  if(labSearch){
    labSearch.oninput = ()=>{
      labFilter = labSearch.value;
      render();
      setTimeout(()=>{
        const el = document.getElementById('labSearch');
        if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      },0);
    };
  }
  const cmdSearch = document.getElementById('cmdSearch');
  if(cmdSearch){
    cmdSearch.oninput = ()=>{
      cmdFilter = cmdSearch.value;
      render();
      setTimeout(()=>{
        const el = document.getElementById('cmdSearch');
        if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      },0);
    };
  }

  document.querySelectorAll('[data-skill-field]').forEach(el=>{
    el.onchange = ()=>{
      const [id, field] = el.getAttribute('data-skill-field').split(':');
      const row = findById(state.skills, parseInt(id));
      row[field] = el.value;
      queueSave();
      if(field==='confidence') render();
    };
  });

  document.getElementById('addLabBtn') && (document.getElementById('addLabBtn').onclick = ()=>{
    pushUndo();
    const nid = (state.labs.reduce((m,l)=>Math.max(m,l.id),0))+1;
    state.labs.push({id:nid, platform:"", machine:"", difficulty:"Easy", os:"Linux", started:"", completed:"", timeSpent:"", foothold:"", privesc:"", hintsUsed:0, rooted:false, reportDone:false, keyLesson:""});
    queueSave(); render();
  });
  document.querySelectorAll('[data-lab-field]').forEach(el=>{
    el.onchange = ()=>{ const [id,f]=el.getAttribute('data-lab-field').split(':'); findById(state.labs,parseInt(id))[f]=el.value; queueSave(); };
  });
  document.querySelectorAll('[data-lab-check]').forEach(el=>{
    el.onchange = ()=>{ const [id,f]=el.getAttribute('data-lab-check').split(':'); findById(state.labs,parseInt(id))[f]=el.checked; queueSave(); render(); };
  });
  document.querySelectorAll('[data-lab-del]').forEach(el=>{
    el.onclick = ()=>{ pushUndo(); const id=parseInt(el.getAttribute('data-lab-del')); state.labs = state.labs.filter(l=>l.id!==id); queueSave(); render(); };
  });

  document.getElementById('addCmdBtn') && (document.getElementById('addCmdBtn').onclick = ()=>{
    pushUndo();
    const nid = (state.commands.reduce((m,c)=>Math.max(m,c.id),0))+1;
    state.commands.push({id:nid, category:"", command:"", purpose:"", whenToUse:"", example:"", relevance:"", practiced:false});
    queueSave(); render();
  });
  document.querySelectorAll('[data-cmd-field]').forEach(el=>{
    el.onchange = ()=>{ const [id,f]=el.getAttribute('data-cmd-field').split(':'); findById(state.commands,parseInt(id))[f]=el.value; queueSave(); };
  });
  document.querySelectorAll('[data-cmd-check]').forEach(el=>{
    el.onchange = ()=>{ const id=parseInt(el.getAttribute('data-cmd-check')); findById(state.commands,id).practiced = el.checked; queueSave(); };
  });
  document.querySelectorAll('[data-cmd-del]').forEach(el=>{
    el.onclick = ()=>{ pushUndo(); const id=parseInt(el.getAttribute('data-cmd-del')); state.commands = state.commands.filter(c=>c.id!==id); queueSave(); render(); };
  });

  document.getElementById('addWeakBtn') && (document.getElementById('addWeakBtn').onclick = ()=>{
    pushUndo();
    const nid = (state.weaknesses.reduce((m,w)=>Math.max(m,w.id),0))+1;
    state.weaknesses.push({id:nid, topic:"", problem:"", firstSeen:new Date().toISOString().slice(0,10), severity:"Medium", revisionNeeded:true, revisionDate:"", revised:false, result:"", confidence:0});
    queueSave(); render();
  });
  document.querySelectorAll('[data-weak-field]').forEach(el=>{
    el.onchange = ()=>{ const [id,f]=el.getAttribute('data-weak-field').split(':'); findById(state.weaknesses,parseInt(id))[f]=el.value; queueSave(); };
  });
  document.querySelectorAll('[data-weak-check]').forEach(el=>{
    el.onchange = ()=>{ const [id,f]=el.getAttribute('data-weak-check').split(':'); findById(state.weaknesses,parseInt(id))[f]=el.checked; queueSave(); };
  });
  document.querySelectorAll('[data-weak-del]').forEach(el=>{
    el.onclick = ()=>{ pushUndo(); const id=parseInt(el.getAttribute('data-weak-del')); state.weaknesses = state.weaknesses.filter(w=>w.id!==id); queueSave(); render(); };
  });

  document.getElementById('addWeekBtn') && (document.getElementById('addWeekBtn').onclick = ()=>{
    pushUndo();
    const nid = (state.weeklyReviews.reduce((m,w)=>Math.max(m,w.id),0))+1;
    state.weeklyReviews.push({id:nid, week:"Week "+nid, plannedHrs:"", actualHrs:"", completionPct:"", machinesDone:"", weakAreas:"", strongAreas:"", reviseNext:"", stopWasting:"", nextPriority:""});
    queueSave(); render();
  });
  document.querySelectorAll('[data-week-field]').forEach(el=>{
    el.onchange = ()=>{ const [id,f]=el.getAttribute('data-week-field').split(':'); findById(state.weeklyReviews,parseInt(id))[f]=el.value; queueSave(); };
  });
  document.querySelectorAll('[data-week-del]').forEach(el=>{
    el.onclick = ()=>{ pushUndo(); const id=parseInt(el.getAttribute('data-week-del')); state.weeklyReviews = state.weeklyReviews.filter(w=>w.id!==id); queueSave(); render(); };
  });

  document.querySelectorAll('[data-mock-field]').forEach(el=>{
    const evt = el.tagName==='TEXTAREA' ? 'oninput' : 'onchange';
    el[evt] = ()=>{ const [id,f]=el.getAttribute('data-mock-field').split(':'); findById(state.mocks,parseInt(id))[f]=el.value; queueSave(); };
  });
}

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  document.getElementById('app').innerHTML = `<div style="padding:60px;text-align:center;font-family:var(--mono);color:var(--text-faint);">Loading operator log…</div>`;
  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('/sw.js'); }catch(e){ console.warn('SW registration failed', e); }
  }
  await loadState();
  applyTheme();
  render();
  startGlobalTick();
  setupKeyboardShortcuts();
})();
</script>
</body>
</html>
